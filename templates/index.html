<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Vigilância Epidemiológica - Dengue SP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body class="bg-gray-100 font-sans">
    <div class="flex h-screen">
        <div class="w-1/4 bg-emerald-950 text-white p-6 flex flex-col justify-between">
            <div>
                <h1 class="text-xl font-bold mb-1 text-emerald-400">🦟 Monitoramento Dengue SP</h1>
                <p class="text-xs text-emerald-200 mb-6">Projeto Integrador IV - UNIVESP</p>
                <div class="bg-emerald-900 p-4 rounded-lg border border-emerald-700">
                    <p class="text-sm text-emerald-100">Status do Sistema: <span class="text-emerald-400 font-bold">Online</span></p>
                </div>
            </div>
            <div class="text-xs text-emerald-400/60">
                Município de São Paulo | Dados Abertos SUS
            </div>
        </div>
        <div class="w-3/4 h-full" id="map"></div>
    </div>
    <script>
        const map = L.map('map').setView([-23.5505, -46.6333], 12);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap'
        }).addTo(map);
    </script>
</body>
</html>
