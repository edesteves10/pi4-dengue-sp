<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitoramento Dengue SP - PI IV</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body class="bg-gray-900 text-white font-sans">
    <div class="flex h-screen">
        <!-- Sidebar -->
        <div class="w-1/3 bg-gray-800 p-6 flex flex-col justify-between overflow-y-auto">
            <div>
                <h1 class="text-2xl font-bold text-emerald-400 mb-1">📌 Vigilância Epidemiológica</h1>
                <p class="text-xs text-gray-400 mb-6">Projeto Integrador IV - UNIVESP</p>
                
                <div class="bg-gray-700/50 p-4 rounded-lg mb-4 border border-gray-600">
                    <span class="text-xs text-gray-400 uppercase font-semibold">Total de Municípios Monitorados</span>
                    <p id="total-municipios" class="text-3xl font-bold text-white mt-1">0</p>
                </div>

                <div class="bg-gray-700/50 p-4 rounded-lg mb-6 border border-gray-600">
                    <span class="text-xs text-gray-400 uppercase font-semibold">Legenda de Risco (K-Means)</span>
                    <div class="flex items-center space-x-2 mt-2">
                        <span class="w-3 h-3 rounded-full bg-red-500 inline-block"></span>
                        <span class="text-sm">Alto Risco</span>
                    </div>
                    <div class="flex items-center space-x-2 mt-1">
                        <span class="w-3 h-3 rounded-full bg-yellow-500 inline-block"></span>
                        <span class="text-sm">Médio Risco</span>
                    </div>
                    <div class="flex items-center space-x-2 mt-1">
                        <span class="w-3 h-3 rounded-full bg-green-500 inline-block"></span>
                        <span class="text-sm">Baixo Risco</span>
                    </div>
                </div>
            </div>

            <div class="text-xs text-gray-500 text-center">
                Dados atualizados via API SINAN/SUS
            </div>
        </div>

        <!-- Mapa -->
        <div class="w-2/3 h-full" id="map"></div>
    </div>

    <script>
        // Inicializa o mapa centralizado em SP
        const map = L.map('map').setView([-22.5, -48.5], 7);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        // Cores baseadas na classificação do K-Means
        const coresRisco = {
            'Alto': '#ef4444',
            'Médio': '#eab308',
            'Baixo': '#22c55e'
        };

        // Requisição para a API Flask
        fetch('/api/dados')
            .then(res => res.json())
            .then(dados => {
                document.getElementById('total-municipios').innerText = dados.length;

                dados.forEach(item => {
                    const cor = coresRisco[item.nivel_risco] || '#3b82f6';

                    L.circleMarker([item.lat, item.lon], {
                        radius: 10,
                        fillColor: cor,
                        color: '#ffffff',
                        weight: 1.5,
                        opacity: 1,
                        fillOpacity: 0.8
                    }).addTo(map)
                    .bindPopup(`
                        <div style="color: #000">
                            <strong style="font-size: 14px">${item.municipio}</strong><br>
                            <b>Casos Notificados:</b> ${item.casos_notificados}<br>
                            <b>Incidência (100k hab):</b> ${item.incidencia_100k}<br>
                            <b>Nível de Risco:</b> <span style="color: ${cor}; font-weight: bold">${item.nivel_risco}</span>
                        </div>
                    `);
                });
            });
    </script>
</body>
</html>
